name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install lm-eval

    - name: Download baseline Qwen2 model
      run: |
        mkdir -p models/local-qwen
        git clone https://huggingface.co/Qwen/Qwen2-0.5B models/local-qwen

    - name: Run tests
      run: |
        pytest tests -q